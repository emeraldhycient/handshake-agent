name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # skip git hook installation in CI

jobs:
  verify:
    name: format · lint · typecheck · test+coverage · build · boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo affected-detection + commitlint range need history

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Requires a committed pnpm-lock.yaml (generated by the first local `pnpm install`).
        run: pnpm install --frozen-lockfile

      - name: Lint PR commit messages
        # PR-only: lint the PR's own commits (base..head) against the Conventional
        # Commits rules in commitlint.config.cjs. Uses the workspace's installed
        # @commitlint/cli so the `extends: config-conventional` resolves.
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Generate Prisma client
        # The prisma-client generator output (api/generated/prisma) is gitignored,
        # so it must exist before lint/typecheck/build can resolve its types.
        run: pnpm --filter @handshake-agent/api exec prisma generate

      - name: Format check
        # Prettier drift is a failing gate, not a silent local-only fixup. Files
        # that are intentionally non-prettier live in .prettierignore.
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Architecture boundaries
        run: pnpm depcruise

      - name: Test + coverage thresholds
        # Unit suites (api jest + web/web-admin/contracts vitest) WITH coverage.
        # `test:cov` runs each suite once and enforces the per-package coverage
        # thresholds (api money-path domain+application; web/web-admin), so a
        # coverage regression fails CI. The api e2e/testcontainers lane runs as a
        # separate `e2e` job below.
        run: pnpm turbo run test:cov

      - name: Build
        run: pnpm turbo run build

  e2e:
    name: api e2e (testcontainers)
    runs-on: ubuntu-latest
    # 80 supertest suites spin real Postgres via @testcontainers/postgresql;
    # give the lane headroom for image pulls + container startup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @handshake-agent/api exec prisma generate

      - name: API e2e (supertest + testcontainers)
        # Docker is available on the ubuntu-latest runner, so @testcontainers/postgresql
        # provisions its own throwaway Postgres per suite — no GH service needed.
        # The suites self-provision required env via test/setup-e2e-env.ts.
        #
        # Memory: ~80 supertest suites each boot a Nest app + a throwaway Postgres.
        # At Jest's default worker count the accumulated per-worker heap OOMs the
        # runner ("JS heap out of memory", exit 134). Cap concurrency to 2 workers,
        # give each worker a larger old-space, and recycle a worker once its heap
        # crosses the idle limit so long-lived state is reclaimed between suites.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # NB: no `--` before the flags. pnpm 10 forwards trailing args to the
        # script verbatim, INCLUDING a literal `--`; jest then reads everything
        # after `--` as positional testPathPatterns, matches zero suites, and
        # exits 1 ("No tests found"). Pass the flags directly so jest parses them
        # as flags (`jest --config … --maxWorkers=2 --workerIdleMemoryLimit=1500M`).
        run: pnpm --filter @handshake-agent/api test:e2e --maxWorkers=2 --workerIdleMemoryLimit=1500M
