name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # skip git hook installation in CI

jobs:
  verify:
    name: lint · typecheck · test · build · boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo affected-detection needs history

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Requires a committed pnpm-lock.yaml (generated by the first local `pnpm install`).
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # The prisma-client generator output (api/generated/prisma) is gitignored,
        # so it must exist before lint/typecheck/build can resolve its types.
        run: pnpm --filter @handshake-agent/api exec prisma generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Architecture boundaries
        run: pnpm depcruise

      - name: Test
        # Integration tests use @testcontainers/postgresql; the ubuntu runner has Docker available.
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build
